[project]
name = "odin-backend"
version = "0.1.0"
description = "ODIN V2 Backend — Personal AI Assistant API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "websockets>=13.1",
    "python-multipart>=0.0.9",
    "alembic>=1.13.0",
    "structlog>=24.1.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "B", "C4", "DTZ", "EM", "EXE", "FA", "ISC", "ICN", "PIE", "PL", "PT", "Q", "RET", "SIM", "T20", "TCH", "TID", "TRY", "ERA", "PD", "PGH", "PYI", "RSE", "RUF", "SLF", "SLOT", "TRY", "NPY"]
ignore = ["ANN101", "ANN102", "ARG001", "ARG002", "B008", "C901", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "ERA001", "EXE005", "PIE001", "PLW290", "PT004", "PT005", "PT006", "PT007", "PT008", "PT009", "PT012", "PT014", "PT015", "RUF012", "SLF001", "T201", "T203", "TRY003", "TRY004", "UP007", "UP035"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"